<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Farroyo · Modo Upgrade</title>
<link rel="icon" type="image/png" href="https://ipfarroyo.com/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2A5B; --azul:#1565D8; --celeste:#EEF5FD; --gris:#5B6475; --borde:#E3E8F0;
  --verde:#0E8A5F; --verdebg:#E8F7F0; --rojo:#C2362B; --rojobg:#FDECEA; --fondo:#F6F8FB;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--navy);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
header img{height:26px}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--azul);background:var(--celeste);padding:5px 9px;border-radius:99px}
h1{font-size:22px;font-weight:800;margin:0 0 4px}
.sub{font-size:13px;color:var(--gris);margin:0 0 16px;line-height:1.45}
.dolar{font-size:12px;color:var(--gris);margin:-8px 0 16px}
.dolar b{color:var(--navy)}
.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:14px;margin-bottom:12px}
.paso{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);margin-bottom:10px}
.paso i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px}
input,select{font:inherit;font-size:15px;color:var(--navy);width:100%;padding:12px;border:1px solid var(--borde);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(21,101,216,.12)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.seg{display:flex;background:var(--fondo);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--gris);padding:8px;border-radius:9px;cursor:pointer}
.seg button[aria-selected=true]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lista{max-height:260px;overflow:auto;margin-top:8px;border-radius:12px}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--borde);border-radius:12px;margin-bottom:6px;cursor:pointer;background:#fff}
.it:hover{border-color:var(--azul)}
.it.sel{border-color:var(--azul);background:var(--celeste)}
.it .n{font-weight:700;font-size:14px}
.it .d{font-size:12px;color:var(--gris);margin-top:2px}
.it .p{font-weight:800;font-size:15px;white-space:nowrap;text-align:right}
.it .p small{display:block;font-size:11px;font-weight:600;color:var(--verde)}
.elegido{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--celeste)}
.elegido .n{font-weight:800}
.elegido .d{font-size:12px;color:var(--gris)}
.elegido .p{font-weight:800;font-size:18px;white-space:nowrap}
.link{border:0;background:none;color:var(--azul);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 0 0}
.vacio{font-size:13px;color:var(--gris);padding:10px 2px}
.aviso{font-size:13px;padding:10px 12px;border-radius:12px;margin-top:10px;line-height:1.4}
.aviso.mal{background:var(--rojobg);color:var(--rojo)}
.aviso.ok{background:var(--verdebg);color:var(--verde)}
.dif{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 12px;border-bottom:1px dashed var(--borde);margin-bottom:12px}
.dif span{font-size:13px;color:var(--gris)}
.dif b{font-size:24px;font-weight:800}
.plan{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--borde);border-radius:14px;margin-bottom:8px;cursor:pointer}
.plan.sel{border:2px solid var(--azul);padding:13px;background:var(--celeste)}
.plan .c{font-size:13px;font-weight:700;color:var(--gris)}
.plan .c em{font-style:normal;display:inline-block;margin-left:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--verde);padding:3px 6px;border-radius:6px;vertical-align:1px}
.plan .v{text-align:right;font-weight:800;font-size:20px}
.plan .v small{display:block;font-size:12px;font-weight:600;color:var(--gris)}
.plan .c i{display:inline-block;width:18px;height:18px;border:2px solid var(--borde);border-radius:6px;margin-right:8px;vertical-align:-4px;background:#fff;font-style:normal;font-size:12px;line-height:14px;text-align:center;color:#fff}
.plan.sel .c i{background:var(--azul);border-color:var(--azul)}
.planes-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gris);margin:4px 0 8px}
.planes-top button{border:0;background:none;font:inherit;font-weight:700;color:var(--azul);cursor:pointer;padding:4px}
.hoy{font-size:13px;color:var(--gris);margin:4px 2px 0;line-height:1.5}
.hoy b{color:var(--navy)}
textarea{font:inherit;font-size:14px;line-height:1.5;width:100%;min-height:190px;padding:12px;border:1px solid var(--borde);border-radius:12px;color:var(--navy);resize:vertical}
.acciones{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--borde);backdrop-filter:blur(8px)}
.acciones .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn.p{background:var(--navy);color:#fff}
.btn.s{background:var(--celeste);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="https://ipfarroyo.com/logo.svg" alt="Farroyo">
    <span class="tag">Modo Upgrade</span>
  </header>
  <h1>Upgrade con DNI</h1>
  <p class="sub">El cliente paga de contado lo que tenía pensado y la diferencia por un equipo mejor la financia con DNI.</p>
  <div class="dolar" id="dolar">Cargando stock y dólar…</div>

  <!-- PASO 1 -->
  <section class="card">
    <div class="paso"><i>1</i> Lo que pidió el cliente</div>
    <div id="baseElegido" hidden></div>
    <div id="baseBuscar">
      <div class="seg" id="baseSeg">
        <button data-m="stock" aria-selected="true">Del stock</button>
        <button data-m="manual" aria-selected="false">Precio a mano</button>
      </div>
      <div data-panel="stock">
        <input id="baseQ" placeholder="Buscar: 13 pro, 15 128…" autocomplete="off">
        <div class="lista" id="baseLista"></div>
      </div>
      <div data-panel="manual" hidden>
        <div class="row">
          <input id="baseNom" placeholder="Equipo (ej. iPhone 13 Pro 128)">
          <input id="baseUsd" type="number" inputmode="decimal" placeholder="USD contado" style="max-width:130px">
        </div>
      </div>
    </div>
  </section>

  <!-- PASO 2 -->
  <section class="card" id="paso2" hidden>
    <div class="paso"><i>2</i> Lo que le ofrecés</div>
    <div id="upElegido" hidden></div>
    <div id="upBuscar">
      <div class="seg" id="upSeg">
        <button data-m="stock" aria-selected="true">Sugeridos</button>
        <button data-m="todos" aria-selected="false">Todo el stock</button>
        <button data-m="manual" aria-selected="false">Precio a mano</button>
      </div>
      <div data-panel="stock">
        <input id="upQ" placeholder="Buscar: 14 pro, 15 256…" autocomplete="off">
        <div class="lista" id="upLista"></div>
      </div>
      <div data-panel="manual" hidden>
        <div class="row">
          <input id="upNom" placeholder="Equipo (ej. iPhone 14 Pro 128)">
          <input id="upUsd" type="number" inputmode="decimal" placeholder="USD contado" style="max-width:130px">
        </div>
      </div>
    </div>
  </section>

  <!-- PASO 3 -->
  <section class="card" id="paso3" hidden>
    <div class="paso"><i>3</i> Cuotas de la diferencia</div>
    <div class="dif"><span>Diferencia a financiar</span><b id="difUsd"></b></div>
    <div id="planes"></div>
    <p class="hoy" id="hoy"></p>
    <div id="avisoTope"></div>
  </section>

  <!-- PASO 4 -->
  <section class="card" id="paso4" hidden>
    <div class="paso"><i>4</i> Mensaje para el cliente</div>
    <textarea id="msg"></textarea>
  </section>
</div>

<div class="acciones">
  <div class="in">
    <button class="btn s" id="reset">Nueva</button>
    <button class="btn p" id="copiar" disabled>Copiar mensaje</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURACIÓN — se toca acá
   ============================================================ */
const CONFIG = {
  API_URL: 'https://api.ipfarroyo.com/',     // mismo stock y dólar que ipfarroyo.com/dni
  // Multiplicador sobre la diferencia (no se muestra al cliente)
  PLANES: [ {n:3, f:1.45}, {n:6, f:1.84}, {n:12, f:2.56} ],
  PLAN_DESTACADO: 12,                        // el que se muestra primero y va en el mensaje
  TOPE_USD: 400,                             // diferencia máxima para Modo Upgrade (más = DNI normal)
  MINIMO_USD: 30,                            // diferencia mínima
  MAX_SUGERIDOS: 25,
  DOLAR_FIJO: null,                          // forzar cotización (ej. 1600). null = automático
  DOLAR_RESPALDO: 1566,
  REDONDEO_PESOS: 100,
  // Texto opcional de garantía en el mensaje ('' = no se menciona)
  GARANTIA: '',
  CATEGORIAS: ['iPhone','iPad']              // qué se puede elegir
};

/* ============================================================ */
const $ = s => document.querySelector(s);
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => 'USD ' + Math.ceil(n).toLocaleString('es-AR');
const ars = n => '$' + (Math.ceil(n / CONFIG.REDONDEO_PESOS) * CONFIG.REDONDEO_PESOS).toLocaleString('es-AR');
const timeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms))]);

const S = { items: [], dolar: null, base: null, up: null, planes: [CONFIG.PLAN_DESTACADO], modoBase: 'stock', modoUp: 'stock' };

const precioUSD = it => it.moneda === 'ARS' ? it.precio / (S.dolar || 1) : it.precio;
const nombre = it => [it.modelo, it.gb].filter(Boolean).join(' ');
const detalle = it => [it.cond, it.bat ? 'Batería ' + it.bat : '', it.color, it.nota].filter(Boolean).join(' · ');
const cuota = (dif, p) => Math.ceil(dif * p.f / p.n);
const planDe = n => CONFIG.PLANES.find(p => p.n === n) || CONFIG.PLANES[CONFIG.PLANES.length - 1];

/* ---------- Carga ---------- */
async function cargar(){
  let j = null;
  try{
    const r = await timeout(fetch(CONFIG.API_URL), 20000);
    j = await r.json();
    try{ localStorage.setItem('farroyo_upgrade_copia', JSON.stringify({t: Date.now(), j})); }catch(e){}
  }catch(e){
    try{ const c = JSON.parse(localStorage.getItem('farroyo_upgrade_copia') || 'null'); if (c) j = c.j; }catch(_){}
  }
  if (j && j.items) S.items = j.items.filter(it => !CONFIG.CATEGORIAS.length || CONFIG.CATEGORIAS.includes(it.cat));
  S.dolar = CONFIG.DOLAR_FIJO || (j && j.dolar && j.dolar.valor) || null;
  if (!S.dolar){
    try{ const r = await timeout(fetch('https://dolarapi.com/v1/dolares/blue'), 6000); const d = await r.json(); S.dolar = d.venta; }catch(e){}
  }
  if (!S.dolar) S.dolar = CONFIG.DOLAR_RESPALDO;
  $('#dolar').innerHTML = `Dólar blue venta: <b>$ ${Math.round(S.dolar).toLocaleString('es-AR')}</b> · ${S.items.length ? S.items.length + ' equipos en stock' : 'sin stock cargado (usá precio a mano)'}`;
  if (!S.items.length) setModo('base', 'manual');
  else { document.querySelectorAll('.seg button[data-m="manual"]').forEach(b => b.hidden = true); $('#baseSeg').style.display = 'none'; }
  renderBase();
}

/* ---------- Paso 1 ---------- */
function filtrar(lista, q){
  const t = norm(q).split(/\s+/).filter(Boolean);
  return lista.filter(it => { const s = norm(nombre(it) + ' ' + it.cond + ' ' + it.color); return t.every(w => s.includes(w)); });
}
function itemHTML(it, extra){
  return `<div class="it" data-k="${S.items.indexOf(it)}"><div><div class="n">${esc(nombre(it))}</div><div class="d">${esc(detalle(it))}</div></div><div class="p">${usd(precioUSD(it))}${extra || ''}</div></div>`;
}
function renderBase(){
  if (S.modoBase !== 'stock') return;
  const q = $('#baseQ').value;
  const l = (q ? filtrar(S.items, q) : S.items).slice().sort((a, b) => precioUSD(a) - precioUSD(b));
  $('#baseLista').innerHTML = l.length ? l.map(it => itemHTML(it)).join('') : '<div class="vacio">No hay equipos con esa búsqueda.</div>';
}
$('#baseLista').addEventListener('click', e => {
  const el = e.target.closest('.it'); if (!el) return;
  const it = S.items[+el.dataset.k];
  elegirBase({ nombre: nombre(it), det: detalle(it), usd: precioUSD(it), item: it });
});
function elegirBase(b){
  S.base = b; S.up = null;
  $('#baseBuscar').hidden = true;
  $('#baseElegido').hidden = false;
  $('#baseElegido').innerHTML = `<div class="elegido"><div><div class="n">${esc(b.nombre)}</div><div class="d">${esc(b.det || 'Precio cargado a mano')}</div></div><div class="p">${usd(b.usd)}</div></div><button class="link" data-cambiar="base">Cambiar</button>`;
  $('#paso2').hidden = false;
  $('#upElegido').hidden = true; $('#upBuscar').hidden = false;
  if (!S.items.length) setModo('up', 'manual');
  renderUp(); renderResultado();
  $('#paso2').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- Paso 2 ---------- */
function sugeridos(){
  if (!S.base) return [];
  const b = S.base.usd, cat = S.base.item && S.base.item.cat;
  // El más barato de cada modelo + capacidad + condición, más caro que el pedido y dentro del tope
  const mejor = new Map();
  S.items.forEach(it => {
    const dif = precioUSD(it) - b;
    if (dif < CONFIG.MINIMO_USD || dif > CONFIG.TOPE_USD) return;
    if (cat && it.cat !== cat) return;
    if (S.base.item && it === S.base.item) return;
    const k = norm(nombre(it) + '|' + it.cond);
    const g = mejor.get(k);
    if (!g || precioUSD(it) < precioUSD(g)) mejor.set(k, it);
  });
  return [...mejor.values()].sort((x, y) => precioUSD(x) - precioUSD(y));
}
function todos(){
  if (!S.base) return [];
  return S.items.filter(it => precioUSD(it) - S.base.usd > 0 && !(S.base.item && it === S.base.item))
    .sort((x, y) => precioUSD(x) - precioUSD(y));
}
function renderUp(){
  if (S.modoUp === 'manual') return;
  const p = planDe(CONFIG.PLAN_DESTACADO);
  const esTodos = S.modoUp === 'todos';
  let l = esTodos ? todos() : sugeridos();
  const q = $('#upQ').value; if (q) l = filtrar(l, q);
  if (!esTodos) l = l.slice(0, CONFIG.MAX_SUGERIDOS);
  $('#upLista').innerHTML = l.length
    ? l.map(it => { const dif = precioUSD(it) - S.base.usd; return itemHTML(it, dif > CONFIG.TOPE_USD ? `<small>supera tope</small>` : `<small>+${p.n} × ${usd(cuota(dif, p))}</small>`); }).join('')
    : esTodos ? '<div class="vacio">No hay equipos más caros que el pedido con esa búsqueda.</div>'
    : `<div class="vacio">No hay equipos entre USD ${CONFIG.MINIMO_USD} y USD ${CONFIG.TOPE_USD} más caros que el pedido. Mirá en "Todo el stock".</div>`;
}
$('#upLista').addEventListener('click', e => {
  const el = e.target.closest('.it'); if (!el) return;
  const it = S.items[+el.dataset.k];
  elegirUp({ nombre: nombre(it), det: detalle(it), usd: precioUSD(it), item: it });
});
function elegirUp(u){
  S.up = u;
  $('#upBuscar').hidden = true;
  $('#upElegido').hidden = false;
  $('#upElegido').innerHTML = `<div class="elegido"><div><div class="n">${esc(u.nombre)}</div><div class="d">${esc(u.det || 'Precio cargado a mano')}</div></div><div class="p">${usd(u.usd)}</div></div><button class="link" data-cambiar="up">Cambiar</button>`;
  renderResultado();
  $('#paso3').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- Paso 3 y 4 ---------- */
function renderResultado(){
  const ok = S.base && S.up;
  $('#paso3').hidden = $('#paso4').hidden = !ok;
  $('#copiar').disabled = !ok;
  if (!ok) return;
  const dif = S.up.usd - S.base.usd;
  $('#difUsd').textContent = usd(Math.max(dif, 0));
  if (dif <= 0){
    $('#planes').innerHTML = ''; $('#hoy').textContent = '';
    $('#avisoTope').innerHTML = '<div class="aviso mal">El equipo ofrecido no es más caro que el pedido.</div>';
    $('#paso4').hidden = true; $('#copiar').disabled = true; return;
  }
  const orden = CONFIG.PLANES.slice().sort((a, b) => (b.n === CONFIG.PLAN_DESTACADO) - (a.n === CONFIG.PLAN_DESTACADO) || b.n - a.n);
  const todas = S.planes.length === CONFIG.PLANES.length;
  $('#planes').innerHTML = `<div class="planes-top"><span>Marcá las cuotas que van en el mensaje (una, dos o las tres)</span><button type="button" id="todasCuotas">${todas ? 'Solo 12' : 'Marcar las 3'}</button></div>` + orden.map(p => {
    const c = cuota(dif, p);
    return `<div class="plan${S.planes.includes(p.n) ? ' sel' : ''}" data-n="${p.n}"><div class="c"><i>✓</i>${p.n} cuotas${p.n === CONFIG.PLAN_DESTACADO ? '<em>Ofrecer primero</em>' : ''}</div><div class="v">${usd(c)}<small>≈ ${ars(c * S.dolar)} por mes</small></div></div>`;
  }).join('');
  $('#hoy').innerHTML = `Hoy paga de contado <b>${usd(S.base.usd)}</b> (≈ ${ars(S.base.usd * S.dolar)} en efectivo), lo mismo que el ${esc(S.base.nombre)}.`;
  $('#avisoTope').innerHTML = dif > CONFIG.TOPE_USD
    ? `<div class="aviso mal">La diferencia supera el tope de USD ${CONFIG.TOPE_USD} del Modo Upgrade. Conviene cotizarlo como DNI normal.</div>`
    : dif < CONFIG.MINIMO_USD ? `<div class="aviso mal">Diferencia muy chica: mejor ajustar el precio que financiar.</div>`
    : '<div class="aviso ok">Recordá: requiere aprobación con DNI (informe BCRA).</div>';
  armarMensaje(dif);
}
function armarMensaje(dif){
  const elegidos = CONFIG.PLANES.filter(p => S.planes.includes(p.n)).sort((a, b) => b.n - a.n);
  const lineaCuota = p => `${p.n} cuotas de ${usd(cuota(dif, p))}* (≈ ${ars(cuota(dif, p) * S.dolar)} por mes)`;
  const cuotas = elegidos.length === 1
    ? [`📆 La diferencia, en *${lineaCuota(elegidos[0])}`]
    : [`📆 La diferencia, en la cantidad de cuotas que prefieras:`, ...elegidos.map(p => `   • *${lineaCuota(p)}`)];
  const nomBase = S.base.nombre.replace(/^iPhone /, ''), nomUp = S.up.nombre;
  const lineas = [
    `¡Hola! 👋 Te armé una propuesta especial:`,
    ``,
    `En lugar del ${nomBase}, llevate el *${nomUp}*${S.up.det ? ' (' + S.up.det + ')' : ''} 🔥`,
    ``,
    `💵 Hoy abonás lo mismo que tenías pensado: *${usd(S.base.usd)}* de contado`,
    ...cuotas,
    `🪪 Solo con tu DNI, sin tarjeta de crédito.`,
    `🗓️ La primera cuota la pagás recién el mes que viene`,
    `📲 Las cuotas se abonan por transferencia, sin necesidad de venir a la oficina`,
  ];
  if (CONFIG.GARANTIA) lineas.push(`✅ ${CONFIG.GARANTIA}`);
  lineas.push(``, `Por muy poco por mes das un salto de equipo 🚀`);
  $('#msg').value = lineas.join('\n');
}
$('#planes').addEventListener('click', e => {
  if (e.target.closest('#todasCuotas')){
    S.planes = S.planes.length === CONFIG.PLANES.length ? [CONFIG.PLAN_DESTACADO] : CONFIG.PLANES.map(p => p.n);
    return renderResultado();
  }
  const el = e.target.closest('.plan'); if (!el) return;
  const n = +el.dataset.n;
  if (S.planes.includes(n)){ if (S.planes.length > 1) S.planes = S.planes.filter(x => x !== n); }
  else S.planes = [...S.planes, n];
  renderResultado();
});

/* ---------- Modos (stock / a mano) ---------- */
function setModo(cual, m){
  S[cual === 'base' ? 'modoBase' : 'modoUp'] = m;
  const box = $(cual === 'base' ? '#baseBuscar' : '#upBuscar');
  box.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.m === m));
  const panel = m === 'manual' ? 'manual' : 'stock';
  box.querySelectorAll('[data-panel]').forEach(p => p.hidden = p.dataset.panel !== panel);
}
$('#baseSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ setModo('base', b.dataset.m); renderBase(); } });
$('#upSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ setModo('up', b.dataset.m); renderUp(); } });
$('#baseQ').addEventListener('input', renderBase);
$('#upQ').addEventListener('input', renderUp);

function manual(cual){
  const nom = $(cual === 'base' ? '#baseNom' : '#upNom').value.trim();
  const v = parseFloat(String($(cual === 'base' ? '#baseUsd' : '#upUsd').value).replace(',', '.'));
  if (!nom || !(v > 0)) return;
  (cual === 'base' ? elegirBase : elegirUp)({ nombre: nom, det: '', usd: v });
}
['#baseNom', '#baseUsd'].forEach(s => $(s).addEventListener('change', () => manual('base')));
['#upNom', '#upUsd'].forEach(s => $(s).addEventListener('change', () => manual('up')));
document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') i.blur(); }));

document.addEventListener('click', e => {
  const b = e.target.closest('[data-cambiar]'); if (!b) return;
  if (b.dataset.cambiar === 'base'){
    S.base = S.up = null;
    $('#baseElegido').hidden = true; $('#baseBuscar').hidden = false;
    $('#paso2').hidden = true; renderBase();
  } else {
    S.up = null;
    $('#upElegido').hidden = true; $('#upBuscar').hidden = false; renderUp();
  }
  renderResultado();
});

$('#reset').addEventListener('click', () => {
  S.base = S.up = null; S.planes = [CONFIG.PLAN_DESTACADO];
  ['#baseQ','#upQ','#baseNom','#baseUsd','#upNom','#upUsd'].forEach(s => $(s).value = '');
  $('#baseElegido').hidden = true; $('#baseBuscar').hidden = false; $('#paso2').hidden = true;
  renderBase(); renderResultado(); window.scrollTo({top:0, behavior:'smooth'});
});

$('#copiar').addEventListener('click', async () => {
  const t = $('#msg').value;
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ $('#msg').select(); document.execCommand('copy'); }
  const toast = $('#toast'); toast.textContent = 'Mensaje copiado ✓'; toast.classList.add('on');
  setTimeout(() => toast.classList.remove('on'), 1600);
});

cargar();
</script>
